<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fog Walk</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div id="map"></div>
<div id="top">
  <div id="hud" role="group" aria-label="Progress"></div>
  <div id="status" role="status"></div>
</div>
<div id="toast" role="status"></div>
<button id="recentre" aria-label="Centre on me">⊕</button>

<script>
// Safety net: if the app script fails to load or run, say so instead of leaving a blank page.
addEventListener('error', (e) => {
  const s = document.getElementById('status');
  if (s && !s.textContent && (e.target === window || e.target.tagName === 'SCRIPT')) s.textContent = 'Something went wrong loading the app. Reload to try again.';
}, true);
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
