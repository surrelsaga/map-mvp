<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fog Walk</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div id="map"></div>
<div id="top">
  <button id="chip" type="button" aria-label="Today: 0 of 3 places. Progress and settings" aria-expanded="false" aria-controls="stats">
    <svg class="ring " viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
      <circle class="ring-track" cx="16" cy="16" r="13"/>
      <path class="ring-arc" d="M16 3a13 13 0 1 1 0 26a13 13 0 1 1 0-26" pathLength="1"/>
      <path class="ring-check" d="M10.5 16.5l3.8 3.8 7.2-7.6"/>
    </svg>
    <span id="chipText">Today</span>
    <svg class="gear" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
  <p id="hint" hidden>Walk to clear the fog. Your progress and settings are here.</p>
  <section id="stats" aria-labelledby="statsTitle" hidden>
    <header class="head">
      <h2 id="statsTitle">Today</h2>
      <button id="closeStats" type="button" aria-label="Close"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="goal">
      <svg class="ring big" viewBox="0 0 32 32" width="48" height="48" aria-hidden="true">
      <circle class="ring-track" cx="16" cy="16" r="13"/>
      <path class="ring-arc" d="M16 3a13 13 0 1 1 0 26a13 13 0 1 1 0-26" pathLength="1"/>
      <path class="ring-check" d="M10.5 16.5l3.8 3.8 7.2-7.6"/>
    </svg>
      <p id="goalText"></p>
    </div>
    <p id="statsPlaces"></p>
    <p id="emptyHint" hidden>Walk to clear the fog. Places appear as you uncover them.</p>
    <div id="progress" hidden><ul id="groups"></ul></div>
    <p id="statsArea"></p>
    <span class="bar" aria-hidden="true"><span id="areaBar"></span></span>
    <button id="lastFind" type="button" hidden>
      <span class="diamond" aria-hidden="true"></span><span class="last-text"><span id="statsLast"></span><span id="lastType"></span></span>
      <svg class="chev-right" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <h2 id="settingsTitle">Settings</h2>
    <button id="soundSwitch" type="button" role="switch" aria-checked="true">
      <span>Sound</span>
      <span class="switch-state" aria-hidden="true"><span class="state">On</span><span class="track"><span class="thumb"></span></span></span>
    </button>
  </section>
  <div id="status" role="status"></div>
</div>
<div id="toast" role="status"><strong id="toastTitle"></strong><span id="toastDetail"></span></div>
<button id="recentre" type="button" aria-label="Centre on me">
  <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
</button>

<script>
// Safety net: if the app script fails to load or run, say so instead of leaving a blank page.
addEventListener('error', (e) => {
  const s = document.getElementById('status');
  if (s && !s.textContent && (e.target === window || e.target.tagName === 'SCRIPT')) s.textContent = 'Something went wrong loading the app. Reload to try again.';
}, true);
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
