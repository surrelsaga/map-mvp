<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fog Walk</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div id="map"></div>
<div id="top">
  <button id="chip" type="button" aria-label="Progress: 0 found" aria-expanded="false" aria-controls="stats"><span id="chipText">0 found</span></button>
  <section id="stats" aria-label="Progress" hidden>
    <p id="statsPlaces"></p>
    <p id="statsArea"></p>
    <p id="statsLast"></p>
    <button id="soundSwitch" type="button" role="switch" aria-checked="true">Sound<span class="state" aria-hidden="true">✓ on</span></button>
  </section>
  <div id="status" role="status"></div>
</div>
<div id="toast" role="status"><strong id="toastTitle"></strong><span id="toastDetail"></span></div>
<button id="recentre" type="button" aria-label="Centre on me">
  <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
</button>

<script>
// Safety net: if the app script fails to load or run, say so instead of leaving a blank page.
addEventListener('error', (e) => {
  const s = document.getElementById('status');
  if (s && !s.textContent && (e.target === window || e.target.tagName === 'SCRIPT')) s.textContent = 'Something went wrong loading the app. Reload to try again.';
}, true);
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
